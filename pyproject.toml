[project]
name = "image-classification"
version = "0.1.0"
description = "Image classification service using PyTorch and TorchServe"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "image_classifier"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
